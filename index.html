<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Sales Manager Workflow Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --dark:#111827;
  --dark2:#1f2937;
  --red:#d71920;
  --red-dark:#b91c1c;
  --green:#15803d;
  --orange:#d97706;
  --purple:#7c3aed;
  --shadow:0 8px 25px rgba(15,23,42,.07);
  --radius:14px;
}

html,body{
  min-height:100%;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Myanmar",
    "Myanmar Text",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================
   APP SHELL
========================= */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:270px;
  background:linear-gradient(180deg,#111827 0%,#0f172a 100%);
  color:#fff;
  position:fixed;
  inset:0 auto 0 0;
  z-index:1000;
  display:flex;
  flex-direction:column;
  transition:.25s ease;
}

.sidebar-header{
  padding:20px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:76px;
  height:36px;
  background:#fff;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 3px 12px rgba(0,0,0,.18);
  flex:none;
  overflow:hidden;
}

.isuzu-word{
  color:#d71920;
  font-size:18px;
  font-weight:950;
  font-style:italic;
  letter-spacing:-1.3px;
  transform:skewX(-10deg);
}

.brand-title{
  font-size:15px;
  font-weight:800;
  line-height:1.25;
}

.brand-sub{
  margin-top:3px;
  font-size:10px;
  color:#9ca3af;
}

.workspace{
  margin-top:16px;
  padding:9px 11px;
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#d1d5db;
  font-size:10px;
  font-weight:800;
  letter-spacing:.8px;
}

.sidebar-nav{
  padding:13px 10px;
  overflow:auto;
  flex:1;
}

.nav-section{
  margin:15px 10px 7px;
  color:#6b7280;
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:10px 12px;
  margin-bottom:3px;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  font-size:13px;
  font-weight:650;
  transition:.18s;
}

.nav-btn:hover{
  background:rgba(255,255,255,.07);
  color:#fff;
}

.nav-btn.active{
  background:#fff;
  color:#111827;
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:15px;
}

.sidebar-footer{
  padding:13px;
  border-top:1px solid rgba(255,255,255,.08);
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#fff;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
}

.user-name{
  font-size:12px;
  font-weight:800;
}

.user-role{
  margin-top:2px;
  color:#9ca3af;
  font-size:10px;
}

/* =========================
   MAIN
========================= */

.main{
  margin-left:270px;
  width:calc(100% - 270px);
  min-width:0;
}

.topbar{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:800;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.top-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.page-title{
  font-size:18px;
  font-weight:850;
}

.page-subtitle{
  margin-top:2px;
  font-size:11px;
  color:var(--muted);
}

.mobile-menu{
  display:none;
  border:0;
  background:#f3f4f6;
  width:40px;
  height:40px;
  border-radius:10px;
  font-size:20px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.container{
  padding:24px;
  max-width:1700px;
  margin:auto;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:#374151;
  min-height:38px;
  padding:8px 13px;
  border-radius:9px;
  font-size:12px;
  font-weight:750;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.18s;
}

.btn:hover{
  border-color:#cbd5e1;
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

.btn-red{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

.btn-green{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.btn-orange{
  background:var(--orange);
  color:#fff;
  border-color:var(--orange);
}

.btn-danger{
  background:#fff;
  color:#dc2626;
  border-color:#fecaca;
}

.btn-small{
  min-height:32px;
  padding:6px 9px;
  font-size:11px;
}

/* =========================
   DASHBOARD
========================= */

.hero{
  background:linear-gradient(135deg,#111827,#1f2937);
  color:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.hero-title{
  font-size:21px;
  font-weight:850;
}

.hero-text{
  margin-top:5px;
  color:#cbd5e1;
  font-size:12px;
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
  margin-bottom:20px;
}

.kpi{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:var(--shadow);
  min-width:0;
}

.kpi-label{
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.kpi-value{
  margin-top:8px;
  font-size:23px;
  font-weight:900;
  line-height:1.1;
}

.kpi-note{
  margin-top:6px;
  color:#9ca3af;
  font-size:10px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1.45fr .9fr;
  gap:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.card-header{
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.card-title{
  font-size:14px;
  font-weight:850;
}

.card-subtitle{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
}

.card-body{
  padding:18px;
}

/* =========================
   WORKFLOW
========================= */

.workflow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.workflow-item{
  position:relative;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
}

.workflow-num{
  font-size:10px;
  color:#9ca3af;
  font-weight:800;
}

.workflow-name{
  margin-top:5px;
  font-size:11px;
  font-weight:800;
}

.workflow-count{
  margin-top:8px;
  font-size:20px;
  font-weight:900;
}

.workflow-bar{
  height:4px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
  margin-top:9px;
}

.workflow-bar span{
  display:block;
  height:100%;
  background:var(--red);
}

/* =========================
   TABLE
========================= */

.table-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.search{
  flex:1;
  min-width:220px;
}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid #d1d5db;
  background:#fff;
  color:#111827;
  border-radius:8px;
  min-height:38px;
  padding:8px 10px;
  outline:none;
  font-size:12px;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:#6b7280;
  box-shadow:0 0 0 3px rgba(107,114,128,.1);
}

.textarea{
  min-height:90px;
  resize:vertical;
}

.table-wrap{
  width:100%;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:#f8fafc;
  color:#475569;
  text-align:left;
  padding:11px 10px;
  font-size:10px;
  font-weight:850;
  white-space:nowrap;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:2;
}

td{
  padding:11px 10px;
  font-size:11px;
  border-bottom:1px solid #f0f1f3;
  vertical-align:middle;
  white-space:nowrap;
}

tbody tr:hover{
  background:#fafafa;
}

td.money{
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.total-row td{
  background:#f8fafc;
  font-weight:900;
  border-top:2px solid #d1d5db;
}

/* Price Master spreadsheet */
.price-table{
  min-width:1650px;
}

.price-table th,
.price-table td{
  border-right:1px solid #edf0f2;
}

.price-table th{
  background:#f1f5f9;
}

.price-table td{
  font-variant-numeric:tabular-nums;
}

.series-cell{
  font-weight:900;
}

.price-highlight{
  font-weight:900;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:850;
  white-space:nowrap;
}

.badge-gray{
  background:#f3f4f6;
  color:#4b5563;
}

.badge-red{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-orange{
  background:#ffedd5;
  color:#9a3412;
}

.badge-purple{
  background:#ede9fe;
  color:#6d28d9;
}

/* =========================
   PAGE HEADER
========================= */

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:17px;
}

.section-title{
  font-size:19px;
  font-weight:900;
}

.section-description{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* =========================
   GRID
========================= */

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.three-col{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-grid.three{
  grid-template-columns:repeat(3,1fr);
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-label{
  font-size:10px;
  font-weight:800;
  color:#4b5563;
}

.full{
  grid-column:1/-1;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.58);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(850px,100%);
  max-height:92vh;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
}

.modal.large{
  width:min(1100px,100%);
}

.modal-header{
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  font-size:15px;
  font-weight:900;
}

.modal-close{
  border:0;
  background:#f3f4f6;
  width:34px;
  height:34px;
  border-radius:8px;
  font-size:18px;
}

.modal-body{
  padding:18px;
  overflow:auto;
}

.modal-footer{
  padding:13px 18px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* =========================
   TIMELINE
========================= */

.timeline{
  position:relative;
  padding-left:25px;
}

.timeline:before{
  content:"";
  position:absolute;
  left:7px;
  top:7px;
  bottom:7px;
  width:2px;
  background:#e5e7eb;
}

.timeline-item{
  position:relative;
  padding-bottom:17px;
}

.timeline-dot{
  position:absolute;
  left:-22px;
  top:3px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#d1d5db;
  border:3px solid #fff;
  box-shadow:0 0 0 1px #d1d5db;
}

.timeline-item.done .timeline-dot{
  background:var(--green);
  box-shadow:0 0 0 1px var(--green);
}

.timeline-stage{
  font-size:12px;
  font-weight:850;
}

.timeline-date{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:30px;
  margin-bottom:8px;
}

.empty-title{
  font-size:13px;
  font-weight:800;
  color:#4b5563;
}

.empty-text{
  margin-top:4px;
  font-size:10px;
}

/* =========================
   OVERLAY
========================= */

.mobile-overlay{
  display:none;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5000;
  background:#111827;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  font-size:11px;
  font-weight:750;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* =========================
   PROGRESS
========================= */

.progress{
  width:100%;
  height:8px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:var(--red);
}

/* =========================
   ALERT
========================= */

.alert{
  border-radius:10px;
  padding:11px 13px;
  font-size:11px;
  margin-bottom:12px;
}

.alert-warning{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
}

.alert-success{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1200px){
  .kpi-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .workflow{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .mobile-overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:900;
  }

  .dashboard-grid,
  .two-col{
    grid-template-columns:1fr;
  }

  .three-col{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:650px){
  .topbar{
    padding:0 13px;
    height:62px;
  }

  .container{
    padding:14px;
  }

  .top-actions .btn-text{
    display:none;
  }

  .top-actions .btn{
    min-width:38px;
    padding:8px;
  }

  .page-title{
    font-size:15px;
  }

  .page-subtitle{
    font-size:9px;
  }

  .kpi-grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .kpi{
    padding:13px;
  }

  .kpi-value{
    font-size:19px;
  }

  .workflow{
    grid-template-columns:repeat(2,1fr);
  }

  .three-col{
    grid-template-columns:1fr;
  }

  .form-grid,
  .form-grid.three{
    grid-template-columns:1fr;
  }

  .section-header{
    align-items:flex-start;
  }

  .section-header .btn{
    flex:none;
  }

  .hero{
    padding:17px;
  }

  .hero-title{
    font-size:17px;
  }

  .card-header{
    padding:13px;
  }

  .card-body{
    padding:13px;
  }

  .modal-backdrop{
    padding:8px;
    align-items:flex-end;
  }

  .modal{
    max-height:94vh;
    border-radius:16px 16px 10px 10px;
  }

  .toast{
    left:12px;
    right:12px;
    bottom:12px;
    text-align:center;
  }
}
</style>
</head>

<div class="app">

      <button class="nav-btn" data-page="customers">

      <button class="nav-btn" data-page="reports">

    <div class="sidebar-footer">

        </div>
      </div>

function uid(prefix="id"){
  return prefix + "_" + Date.now() + "_" +

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){
  const n = Number(value || 0);
  return new Intl.NumberFormat("en-US").format(n) + " Ks";
}

function numberOnly(value){
  const n = Number(value || 0);
  return new Intl.NumberFormat("en-US").format(n);
}

function dateText(value){
  if(!value) return "-";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return esc(value);
  }

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function normalize(value){
  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g,"");
}

/* =========================================================

========================================================= */

function findPrice(series,length){

  const s = normalize(series);
  const l = Number(length);

  return prices.find(p =>
    normalize(p.series) === s &&
    Number(p.length) === l
  ) || null;
}

function getVehiclePrice(vehicle){

  const p = findPrice(vehicle.series,vehicle.length);

  if(!p) return 0;

  const body = String(vehicle.bodyType || "").toUpperCase();

  if(body.includes("BOX")){
    return Number(p.boxTotal || 0);
  }

  return Number(p.cargoTotal || 0);
}

function compactMoney(value){

  }

  return numberOnly(n);
}

function stageBadge(stage){

  if(stage === "Delivery Completed"){
    return `<span class="badge badge-green">${esc(stage)}</span>`;
  }

  if(
    stage === "အခွန်ဆောင်" ||
    stage === "နံပါတ်ယူ" ||
    stage === "ယာဉ်စစ်"
  ){
    return `<span class="badge badge-orange">${esc(stage)}</span>`;
  }

  if(
    stage === "Production" ||
    stage === "Body Building"
  ){
    return `<span class="badge badge-purple">${esc(stage)}</span>`;
  }

  return `<span class="badge badge-gray">${esc(stage)}</span>`;
}

function bindVehicles(){

  document.getElementById("addVehicleBtn")
    .onclick = ()=>openVehicleModal();

  const search = document.getElementById("vehicleSearch");
  const stage = document.getElementById("vehicleStageFilter");
  const series = document.getElementById("vehicleSeriesFilter");

  function refresh(){

    const q = normalize(search.value);
    const st = stage.value;
    const se = normalize(series.value);

    const filtered = vehicles.filter(v=>{

      const text = normalize([
        v.series,
        v.length,
        v.chassis,
        v.bodyType,
        v.customer,
        v.carNo,
        v.currentStage
      ].join(" "));

      return (
        (!q || text.includes(q)) &&
        (!st || v.currentStage === st) &&
        (!se || normalize(v.series) === se)
      );
    });

    document.getElementById("vehicleTableContainer")
      .innerHTML = vehicleTable(filtered);

    bindVehicleActions();
  }

  search.oninput = refresh;
  stage.onchange = refresh;
  series.onchange = refresh;

  bindVehicleActions();
}

function syncLengthFromSeries(){

  const series = document.getElementById("vSeries").value;

  const p = prices.find(x=>x.series===series);

  if(p){
    document.getElementById("vLength").value = p.length;
  }
}

function updateVehiclePricePreview(){

  const series = document.getElementById("vSeries").value;
  const length = document.getElementById("vLength").value;

  const p = findPrice(series,length);

  const el = document.getElementById("vehiclePricePreview");

  if(!p){
    el.className="alert alert-warning";
    el.innerHTML="No current price found for this Series + Length";
    return;
  }

  el.className="alert alert-success";

  el.innerHTML = `
    <strong>${esc(p.series)} / ${esc(p.length)} ft</strong>
    &nbsp; | &nbsp;
    Cargo Total: <strong>${money(p.cargoTotal)}</strong>
    &nbsp; | &nbsp;
    Box Total: <strong>${money(p.boxTotal)}</strong>
  `;
}

function saveVehicle(){

  const form = document.getElementById("vehicleForm");

  if(!form.reportValidity()){
    return;
  }

  const data = {
    productionMonth:document.getElementById("vMonth").value,
    series:document.getElementById("vSeries").value,
    length:document.getElementById("vLength").value,
    chassis:document.getElementById("vChassis").value.trim(),
    bodyType:document.getElementById("vBodyType").value,
    bodyBuilder:document.getElementById("vBodyBuilder").value.trim(),
    customer:document.getElementById("vCustomer").value.trim(),
    carNo:document.getElementById("vCarNo").value.trim(),
    requiredDate:document.getElementById("vRequired").value,
    currentStage:document.getElementById("vStage").value,
    remark:document.getElementById("vRemark").value.trim()
  };

  const duplicate = vehicles.find(x =>
    normalize(x.chassis) === normalize(data.chassis) &&
    x.id !== editingVehicleId
  );

  if(duplicate){
    toast("Chassis No. already exists");
    return;
  }

  if(editingVehicleId){

    const index = vehicles.findIndex(
      x=>x.id===editingVehicleId
    );

    if(index !== -1){

      const old = vehicles[index];

      vehicles[index] = {
        ...old,
        ...data,
        workflow:old.workflow || {}
      };

      if(
        old.currentStage !== data.currentStage &&
        data.currentStage
      ){
        vehicles[index].workflow[data.currentStage] =
          today();
      }
    }

    toast("Vehicle updated");

  }else{

    const workflow={};

    STAGES.forEach(s=>workflow[s]="");

    workflow[data.currentStage]=today();

    vehicles.unshift({
      id:uid("vehicle"),
      ...data,
      createdAt:today(),
      workflow
    });

    toast("Vehicle added");
  }

  saveVehicles();
  closeModal();
  renderPage();
}

  vehicles=vehicles.filter(x=>x.id!==id);

function taxTable(list){

  if(!list.length){

    return `
      <div class="empty">

          No MMC invoice records
        </div>
        <div class="empty-text">

        </div>
      </div>
    `;
  }

  return `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Invoice No.</th>
            <th>Month</th>
            <th>Series</th>
            <th>Length</th>
            <th>Chassis</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Reconcile</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>

          ${list.map(t=>{

            const r = reconcileTax(t);

            return `
              <tr>

                <td>
                  <strong>${esc(t.invoiceNo)}</strong>
                </td>

                <td>${esc(t.month || "-")}</td>

                <td class="series-cell">
                  ${esc(t.series)}

                    : `<span class="badge badge-orange">Pending</span>`
                  }
                </td>

                <td>
                  ${
                    r.duplicate
                    ? `<span class="badge badge-red">DUPLICATE</span>`
                    : r.matched
                      ? `<span class="badge badge-green">MATCHED</span>`
                      : `<span class="badge badge-red">NOT MATCHED</span>`

                  <button

function reconcileTax(t){

  const matchedVehicle =
    vehicles.find(v =>
      normalize(v.chassis) === normalize(t.chassis)
    );

  const duplicate =
    taxes.filter(x =>
      normalize(x.invoiceNo) === normalize(t.invoiceNo)
    ).length > 1;

  return {
    matched:!!matchedVehicle,
    duplicate,
    vehicle:matchedVehicle || null
  };
}

function bindTax(){

  document.getElementById("addTaxBtn")
    .onclick=()=>openTaxModal();

  const search=document.getElementById("taxSearch");
  const status=document.getElementById("taxStatusFilter");

  function refresh(){

    const q=normalize(search.value);
    const st=status.value;

    const filtered=taxes.filter(t=>{

      const text=normalize([
        t.invoiceNo,
        t.month,
        t.series,
        t.length,
        t.chassis,
        t.customer
      ].join(" "));

      return (
        (!q || text.includes(q)) &&
        (!st || t.status===st)
      );
    });

    document.getElementById("taxTableContainer")
      .innerHTML=taxTable(filtered);

    bindTaxActions();
  }

  search.oninput=refresh;
  status.onchange=refresh;

  bindTaxActions();
}

function syncTaxLength(){

    document.getElementById("taxSeries").value;

  const p=prices.find(x=>x.series===series);

  if(p){
    document.getElementById("taxLength").value=p.length;
  }
}

function suggestTaxUnitPrice(){

  const series=
    document.getElementById("taxSeries").value;

  const length=
    document.getElementById("taxLength").value;

  const p=findPrice(series,length);

  if(p){
    const field=document.getElementById("taxUnitPrice");

    if(!field.value || Number(field.value)===0){
      field.value=p.carPrice;
      document.getElementById("taxQty").dispatchEvent(
        new Event("input")
      );
    }
  }
}

function updateTaxMatchPreview(){

  const chassis =
    document.getElementById("taxChassis").value;

  const el =
    document.getElementById("taxMatchPreview");

  if(!chassis){
    el.innerHTML="";
    return;
  }

  const v=vehicles.find(x =>
    normalize(x.chassis)===normalize(chassis)
  );

  const duplicate=taxes.find(x =>
    normalize(x.invoiceNo) ===
    normalize(document.getElementById("taxInvoice").value) &&
    x.id !== editingTaxId
  );

  let html="";

  if(v){
    html += `
      <span class="badge badge-green">
        MATCHED — ${esc(v.series)} / ${esc(v.customer || "-")}
      </span>
    `;
  }else{
    html += `
      <span class="badge badge-red">
        NOT MATCHED — Chassis not found in Vehicle Master
      </span>
    `;
  }

  if(duplicate){
    html += `
      <span class="badge badge-red">
        DUPLICATE INVOICE
      </span>
    `;
  }

  el.innerHTML=html;
}

function saveTax(){

  const form=document.getElementById("taxForm");

  if(!form.reportValidity()) return;

  const data={
    month:document.getElementById("taxMonth").value,
    invoiceNo:document.getElementById("taxInvoice").value.trim(),
    series:document.getElementById("taxSeries").value,
    length:document.getElementById("taxLength").value,
    chassis:document.getElementById("taxChassis").value.trim(),
    quantity:Number(document.getElementById("taxQty").value||0),
    unitPrice:Number(document.getElementById("taxUnitPrice").value||0),
    amount:Number(document.getElementById("taxAmount").value||0),
    status:document.getElementById("taxStatus").value,
    paidDate:document.getElementById("taxPaidDate").value,
    customer:document.getElementById("taxCustomer").value.trim(),
    remark:document.getElementById("taxRemark").value.trim()
  };

  const duplicate=taxes.find(x=>
    normalize(x.invoiceNo)===normalize(data.invoiceNo) &&
    x.id!==editingTaxId
  );

  if(duplicate){
    if(!confirm(
      "This Invoice Number already exists. Save as duplicate?"
    )){
      return;
    }
  }

  if(editingTaxId){

    const i=taxes.findIndex(x=>x.id===editingTaxId);

    if(i!==-1){
      taxes[i]={
        ...taxes[i],
        ...data
      };
    }

    toast("MMC invoice updated");

  }else{

    taxes.unshift({
      id:uid("tax"),
      ...data,
      createdAt:today()
    });

    toast("MMC invoice added");
  }

  saveTaxes();
  closeModal();
  renderPage();
}

function bindPrice(){

  document.getElementById("addPriceBtn")
    .onclick=()=>openPriceModal();

  document.getElementById("exportPriceBtn")
    .onclick=()=>exportPricesCSV();

  const search=document.getElementById("priceSearch");
  const length=document.getElementById("priceLengthFilter");

  function refresh(){

    const q=normalize(search.value);
    const l=length.value;

    const filtered=prices.filter(p=>{

      return (
        (!q ||
          normalize(p.series).includes(q) ||
          normalize(p.length).includes(q)
        ) &&
        (!l || String(p.length)===String(l))
      );

    });

    document.getElementById("priceTableContainer")
      .innerHTML=priceTable(filtered);

    bindPriceActions();
  }

  search.oninput=refresh;
  length.onchange=refresh;

  bindPriceActions();
}

function bindPriceActions(){

  document.querySelectorAll("[data-price-view]")
    .forEach(btn=>{
      btn.onclick=()=>{
        viewPrice(btn.dataset.priceView);

    });

  document.querySelectorAll("[data-price-edit]")
    .forEach(btn=>{
      btn.onclick=()=>{
        openPriceModal(btn.dataset.priceEdit);
      };
    });

  document.querySelectorAll("[data-price-delete]")
    .forEach(btn=>{
      btn.onclick=()=>{
        deletePrice(btn.dataset.priceDelete);
      };
    });
}

function savePrice(){

  const form=document.getElementById("priceForm");

  if(!form.reportValidity()) return;

  const keys=[
    "series",
    "length",
    "carPrice",
    "box",
    "incomeTax",
    "additional",
    "cargoPackage",
    "boxPackage",
    "cargoWithoutIT",
    "boxWithoutIT",
    "cargoTotal",
    "boxTotal"
  ];

  const data={};

  keys.forEach(key=>{

    const value=
      document.getElementById("price_"+key).value;

    data[key]=key==="series"
      ? value.trim()
      : Number(value||0);
  });

  const duplicate=prices.find(x=>
    normalize(x.series)===normalize(data.series) &&
    Number(x.length)===Number(data.length) &&
    x.id!==editingPriceId
  );

  if(duplicate){
    toast("This Series + Length already exists");
    return;
  }

  if(editingPriceId){

    const i=prices.findIndex(x=>x.id===editingPriceId);

    if(i!==-1){
      prices[i]={
        ...prices[i],
        ...data
      };
    }

    toast("Price updated");

  }else{

    prices.push({
      id:uid("price"),
      ...data
    });

    toast("Price added");
  }

  savePrices();
  closeModal();
  renderPage();
}

function overdueVehicles(){

  const now=new Date();

  return vehicles.filter(v=>{

    if(!v.requiredDate) return false;

    if(v.currentStage==="Delivery Completed"){
      return false;
    }

    const due=new Date(v.requiredDate);

    return due < now;

  });
}

    if(!v.requiredDate) return false;

    if(v.currentStage==="Delivery Completed"){

    const due=new Date(v.requiredDate);

      (1000*60*60*24);

    return diff>=0 && diff<=7;

  return `

      )}

        taxes.filter(t=>t.status!=="Paid").length,

      )}

      ${kpi(
        "Not Matched",
        taxes.filter(t=>!reconcileTax(t).matched).length,

      <div class="card">

        <div class="card-header">

/* =========================================================
   CSV EXPORT
========================================================= */

function csvEscape(value){

  const s=String(value ?? "");

  if(/[",\n]/.test(s)){
    return '"' + s.replace(/"/g,'""') + '"';
  }

  return s;
}

function downloadCSV(filename,headers,rows){

  const csv=[
    headers.map(csvEscape).join(","),
    ...rows.map(
      row=>row.map(csvEscape).join(",")
    )
  ].join("\n");

  const blob=new Blob(
    ["\uFEFF"+csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  toast("CSV exported");
}

/* =========================================================
   BACKUP
========================================================= */

function downloadBackup(){

  const backup={
    app:"Sales Manager Workflow Pro",
    version:"3.0",
    exportedAt:new Date().toISOString(),
    vehicles,
    taxes,
    prices
  };

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=
    "sales-manager-workflow-backup-" +
    today() +
    ".json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  toast("Full backup downloaded");
}

function restoreBackup(){

  const file=
    document.getElementById("restoreFile").files[0];

  if(!file){
    toast("Select a JSON backup file first");
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{

    try{

      const data=JSON.parse(reader.result);

      if(!Array.isArray(data.vehicles) ||
         !Array.isArray(data.taxes) ||
         !Array.isArray(data.prices)){

        toast("Invalid backup file");
        return;
      }

      if(!confirm(
        "Restore backup and replace current local data?"
      )){
        return;
      }

      vehicles=data.vehicles;
      taxes=data.taxes;
      prices=data.prices;

      saveVehicles();
      saveTaxes();
      savePrices();

      toast("Backup restored");

      renderPage();

    }catch(e){

      toast("Could not read backup file");

    }

  };

  reader.readAsText(file);
}

/* =========================================================
   CLEAR DATA
========================================================= */

function clearAllData(){

  if(!confirm(
    "This will delete Vehicle, Tax and Price data. Continue?"
  )){
    return;
  }

  if(!confirm(
    "Final confirmation: clear ALL application data?"
  )){
    return;
  }

  localStorage.removeItem(VEHICLE_KEY);
  localStorage.removeItem(TAX_KEY);
  localStorage.removeItem(PRICE_KEY);

  vehicles=[];
  taxes=[];
  prices=[];

  loadData();

  toast("Application data cleared");

  renderPage();
}
