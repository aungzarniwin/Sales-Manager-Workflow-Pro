<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sales Manager Workflow Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#0f172a;
  --navy2:#111827;
  --navy3:#1e293b;
  --red:#d71920;
  --red2:#b91c1c;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --line:#e5e7eb;
  --green:#16a34a;
  --orange:#f59e0b;
  --blue:#2563eb;
  --purple:#7c3aed;
  --danger:#dc2626;
  --shadow:0 8px 28px rgba(15,23,42,.08);
  --radius:16px;
}

html,body{
  min-height:100%;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Myanmar",
    "Myanmar Text",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   APP SHELL
========================= */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:270px;
  background:linear-gradient(180deg,#0b1220 0%,#111827 100%);
  color:#fff;
  z-index:1000;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
}

.brand{
  padding:18px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-logo-wrap{
  background:#fff;
  border-radius:12px;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:12px;
}

/* Stable ISUZU-style wordmark.
   No external image dependency */
.isuzu-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  background:#fff;
}

.isuzu-word{
  font-family:Arial,Helvetica,sans-serif;
  font-weight:900;
  font-style:italic;
  font-size:35px;
  letter-spacing:-2px;
  color:#d71920;
  transform:skew(-8deg);
  line-height:1;
}

.brand-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:.2px;
}

.brand-sub{
  margin-top:4px;
  font-size:11px;
  color:#94a3b8;
}

.workspace{
  display:inline-flex;
  margin-top:11px;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(215,25,32,.14);
  color:#fca5a5;
  border:1px solid rgba(215,25,32,.3);
  font-size:10px;
  font-weight:800;
  letter-spacing:.5px;
}

.nav{
  padding:14px 10px;
  flex:1;
}

.nav-section{
  padding:12px 10px 7px;
  font-size:10px;
  font-weight:800;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.9px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:11px 12px;
  border-radius:10px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:3px;
  transition:.18s;
}

.nav-btn:hover{
  background:rgba(255,255,255,.06);
  color:#fff;
}

.nav-btn.active{
  background:linear-gradient(90deg,rgba(215,25,32,.22),rgba(215,25,32,.08));
  color:#fff;
  box-shadow:inset 3px 0 0 var(--red);
}

.nav-icon{
  width:23px;
  text-align:center;
  font-size:16px;
}

.sidebar-footer{
  padding:13px;
  border-top:1px solid rgba(255,255,255,.08);
  color:#64748b;
  font-size:10px;
  line-height:1.5;
}

.main{
  margin-left:270px;
  width:calc(100% - 270px);
  min-width:0;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:500;
}

.top-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-mobile{
  display:none;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}

.page-title{
  font-size:19px;
  font-weight:800;
}

.page-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  padding:10px 13px;
  border-radius:10px;
  font-weight:700;
  font-size:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:40px;
}

.btn:hover{
  background:#f8fafc;
}

.btn-primary{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

.btn-primary:hover{
  background:var(--red2);
}

.btn-dark{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

.btn-success{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.btn-danger{
  background:#fff;
  color:var(--danger);
  border-color:#fecaca;
}

.btn-small{
  min-height:34px;
  padding:7px 10px;
  font-size:11px;
}

.content{
  padding:22px;
  max-width:1700px;
  margin:auto;
}

/* =========================
   COMMON
========================= */

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
}

.section-title{
  font-size:17px;
  font-weight:800;
}

.section-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:13px;
  margin-bottom:20px;
}

.kpi{
  padding:17px;
  min-height:120px;
  position:relative;
  overflow:hidden;
}

.kpi-label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.kpi-value{
  margin-top:10px;
  font-size:25px;
  font-weight:900;
  letter-spacing:-.6px;
}

.kpi-note{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
}

.kpi-icon{
  position:absolute;
  right:14px;
  top:14px;
  width:35px;
  height:35px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f5f9;
  font-size:16px;
}

.grid-2{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:18px;
  margin-bottom:20px;
}

.panel{
  padding:18px;
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.panel-title{
  font-size:14px;
  font-weight:800;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:11px;
}

/* =========================
   WORKFLOW
========================= */

.workflow{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:7px;
}

.workflow-step{
  min-width:0;
  padding:12px 7px;
  border:1px solid var(--line);
  border-radius:11px;
  text-align:center;
  background:#fafafa;
}

.workflow-num{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#e2e8f0;
  color:#475569;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 7px;
  font-size:11px;
  font-weight:900;
}

.workflow-step.done{
  background:#f0fdf4;
  border-color:#bbf7d0;
}

.workflow-step.done .workflow-num{
  background:#16a34a;
  color:#fff;
}

.workflow-label{
  font-size:10px;
  font-weight:800;
  line-height:1.35;
}

/* =========================
   TABLE
========================= */

.table-card{
  overflow:hidden;
}

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th{
  background:#f8fafc;
  color:#64748b;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.4px;
  padding:12px 11px;
  text-align:left;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  padding:12px 11px;
  border-bottom:1px solid #eef2f7;
  font-size:11px;
  vertical-align:middle;
}

tbody tr:hover{
  background:#fafafa;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 8px;
  border-radius:999px;
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-orange{
  background:#fef3c7;
  color:#92400e;
}

.badge-red{
  background:#fee2e2;
  color:#991b1b;
}

.badge-blue{
  background:#dbeafe;
  color:#1e40af;
}

.badge-gray{
  background:#e2e8f0;
  color:#475569;
}

.action-row{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.search{
  flex:1;
  min-width:220px;
  position:relative;
}

.search input{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  padding:0 13px 0 38px;
  outline:none;
}

.search input:focus,
.form-control:focus{
  border-color:#94a3b8;
  box-shadow:0 0 0 3px rgba(148,163,184,.12);
}

.search-icon{
  position:absolute;
  left:13px;
  top:12px;
  color:#94a3b8;
}

select.filter{
  height:42px;
  min-width:150px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:0 12px;
}

/* =========================
   FORMS
========================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-label{
  font-size:11px;
  font-weight:800;
  color:#475569;
}

.form-control{
  width:100%;
  min-height:42px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
  outline:none;
  background:#fff;
}

textarea.form-control{
  min-height:90px;
  resize:vertical;
}

.form-full{
  grid-column:1/-1;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.62);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(800px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.28);
}

.modal-header{
  position:sticky;
  top:0;
  background:#fff;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:17px 18px;
  border-bottom:1px solid var(--line);
}

.modal-title{
  font-size:16px;
  font-weight:900;
}

.close{
  width:35px;
  height:35px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  font-size:18px;
}

.modal-body{
  padding:18px;
}

/* =========================
   PRICE
========================= */

.price-highlight{
  background:linear-gradient(135deg,#fff7f7,#fff);
  border:1px solid #fecaca;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
}

.price-main{
  font-size:25px;
  font-weight:900;
  color:var(--red);
}

.price-label{
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.price-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.price-box{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  background:#fff;
}

.price-box-label{
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  line-height:1.3;
}

.price-box-value{
  margin-top:5px;
  font-size:13px;
  font-weight:900;
}

.price-total{
  border-color:#fecaca;
  background:#fff7f7;
}

/* =========================
   EMPTY / ALERT
========================= */

.empty{
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:34px;
  margin-bottom:8px;
}

.alert{
  padding:11px 13px;
  border-radius:10px;
  font-size:11px;
  margin-bottom:12px;
}

.alert-info{
  background:#eff6ff;
  color:#1e40af;
  border:1px solid #bfdbfe;
}

.alert-warning{
  background:#fffbeb;
  color:#92400e;
  border:1px solid #fde68a;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:5000;
  min-width:240px;
  max-width:360px;
  padding:13px 15px;
  border-radius:11px;
  color:#fff;
  background:#0f172a;
  box-shadow:0 15px 35px rgba(0,0,0,.2);
  font-size:12px;
  font-weight:700;
  opacity:0;
  transform:translateY(15px);
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.toast.success{
  background:#166534;
}

.toast.error{
  background:#991b1b;
}

/* =========================
   MOBILE
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.5);
  z-index:900;
}

@media(max-width:1200px){
  .kpi-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .workflow{
    grid-template-columns:repeat(5,1fr);
  }

  .price-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:850px){
  .sidebar{
    transform:translateX(-100%);
    transition:.22s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay.show{
    display:block;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .menu-mobile{
    display:block;
  }

  .topbar{
    padding:0 13px;
  }

  .top-actions .btn-export{
    display:none;
  }

  .content{
    padding:14px;
  }

  .grid-2{
    grid-template-columns:1fr;
  }

  .kpi-grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .kpi{
    min-height:105px;
    padding:13px;
  }

  .kpi-value{
    font-size:21px;
  }

  .workflow{
    grid-template-columns:repeat(3,1fr);
  }

  .form-grid,
  .form-grid-3{
    grid-template-columns:1fr;
  }

  .price-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .page-title{
    font-size:16px;
  }

  .page-subtitle{
    display:none;
  }
}

@media(max-width:520px){
  .top-actions .btn-add{
    padding:9px;
    width:40px;
    font-size:0;
  }

  .top-actions .btn-add span{
    font-size:17px;
  }

  .workflow{
    grid-template-columns:repeat(3,1fr);
  }

  .price-grid{
    grid-template-columns:1fr 1fr;
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .toolbar{
    flex-direction:column;
  }

  .search{
    width:100%;
  }

  select.filter{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">

      <div class="brand-logo-wrap">
        <div class="isuzu-logo" aria-label="ISUZU">
          <div class="isuzu-word">ISUZU</div>
        </div>
      </div>

      <div class="brand-title">Sales Manager Workflow Pro</div>
      <div class="brand-sub">Vehicle Sales & Operations</div>
      <div class="workspace">ISUZU WORKSPACE</div>

    </div>

    <nav class="nav">

      <div class="nav-section">Main</div>

      <button class="nav-btn active" data-page="dashboard">
        <span class="nav-icon">▦</span>
        Dashboard
      </button>

      <button class="nav-btn" data-page="vehicles">
        <span class="nav-icon">🚚</span>
        Vehicles
      </button>

      <button class="nav-btn" data-page="production">
        <span class="nav-icon">🏭</span>
        Production
      </button>

      <button class="nav-btn" data-page="tax">
        <span class="nav-icon">🧾</span>

      </button>

      <button class="nav-btn" data-page="prices">

      </button>

      <button class="nav-btn" data-page="registration">
        <span class="nav-icon">🪪</span>
        Registration
      </button>

      <button class="nav-btn" data-page="delivery">

        Delivery
      </button>

      <div class="nav-section">Management</div>

      <button class="nav-btn" data-page="customers">
        <span class="nav-icon">👥</span>
        Customers
      </button>

      <button class="nav-btn" data-page="reports">
        <span class="nav-icon">📊</span>
        Reports
      </button>

      <button class="nav-btn" data-page="daily">

      </button>

      <button class="nav-btn" data-page="settings">

      </button>

    </nav>

    <div class="sidebar-footer">

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div class="top-left">
        <button class="menu-mobile" id="mobileMenu">☰</button>

        <div>
          <div class="page-title" id="pageTitle">
            Dashboard
          </div>
          <div class="page-subtitle" id="pageSubtitle">
            Vehicle sales workflow control
          </div>
        </div>
      </div>

      <div class="top-actions">

        <button class="btn btn-export" id="exportAllBtn">
          ↓ Export
        </button>

        <button class="btn btn-primary btn-add" id="globalAddBtn">
          <span>＋</span> Add Vehicle
        </button>

      </div>

    </header>

    <section class="content" id="appContent"></section>

  </main>
</div>


<!-- GENERIC MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>


<script>
/* =========================================================
   SALES MANAGER WORKFLOW PRO V3

const VEHICLE_KEY = "sales_manager_workflow_pro_v3_vehicles";

let vehicles = [];

/* =========================================================

const DEFAULT_PRICES = [

  {

/* =========================================================

========================================================= */

function loadData(){

  try{
    vehicles = JSON.parse(localStorage.getItem(VEHICLE_KEY)) || [];
  }catch(e){
    vehicles = [];
  }

  try{
    taxRecords = JSON.parse(localStorage.getItem(TAX_KEY)) || [];
  }catch(e){
    taxRecords = [];
  }

  try{
    prices = JSON.parse(localStorage.getItem(PRICE_KEY)) || [];
  }catch(e){
    prices = [];
  }

  if(!prices.length){
    prices = structuredClone(DEFAULT_PRICES);
    savePrices();
  }

  if(!vehicles.length){
    vehicles = [
      {
        id:uid(),
        productionMonth:"2026-10",
        series:"NMR71E",
        length:"10",
        chassis:"JAA1MR77HT7100921",
        bodyType:"DRY BOX",
        bodyBuilder:"Yoma Body",
        customer:"Yoma Fleet",
        carNo:"",
        requiredDate:"",
        stage:2,
        createdAt:today(),
        remark:"Demo vehicle"
      }
    ];

    saveVehicles();
  }
}

function saveVehicles(){
  localStorage.setItem(VEHICLE_KEY,JSON.stringify(vehicles));
}

function saveTax(){
  localStorage.setItem(TAX_KEY,JSON.stringify(taxRecords));
}

function savePrices(){
  localStorage.setItem(PRICE_KEY,JSON.stringify(prices));
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(n){
  return Number(n || 0).toLocaleString("en-US");
}

function amountNumber(v){
  return Number(String(v ?? "").replaceAll(",","")) || 0;
}


/* =========================================================

========================================================= */

function toast(message,type=""){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.className="toast show "+type;

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{
    el.className="toast";
  },2500);
}

function navigate(page){

  currentPage=page;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  const titles={
    dashboard:["Dashboard","Vehicle sales workflow control"],
    vehicles:["Vehicles","Vehicle master & workflow tracking"],
    production:["Production","Production and body building control"],
    tax:["MMC Tax & Invoice","Myanmar Motor Corporation tax invoice control"],
    prices:["Current Vehicle Price","Current ISUZU vehicle price master"],
    registration:["Registration","Number plate, inspection and owner book"],
    delivery:["Delivery","Vehicle handover & delivery control"],
    customers:["Customers","Customer vehicle summary"],
    reports:["Reports","Management reports and summaries"],
    daily:["Daily Manager","Today / overdue follow-up"],
    settings:["Settings","Backup, restore and local data"]
  };

  document.getElementById("pageTitle").textContent=titles[page][0];
  document.getElementById("pageSubtitle").textContent=titles[page][1];

  renderPage();
}

function renderPage(){

  const content=document.getElementById("appContent");

  if(currentPage==="dashboard") content.innerHTML=dashboardHTML();
  if(currentPage==="vehicles") content.innerHTML=vehiclesHTML();
  if(currentPage==="production") content.innerHTML=productionHTML();

  if(currentPage==="registration") content.innerHTML=registrationHTML();

}

/* =========================================================
   STAGE BADGE
========================================================= */

function stageBadge(stage){

  const label=STAGES[stage-1] || "Unknown";

  let cls="badge-gray";

  if(stage>=9) cls="badge-green";
  else if(stage>=5) cls="badge-blue";
  else if(stage>=3) cls="badge-orange";

  return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
}

function saveVehicle(){

  const chassis=document.getElementById("vChassis").value.trim();

  if(!chassis){
    toast("Chassis No. is required","error");
    return;
  }

  const duplicate=vehicles.find(v=>
    v.chassis.toLowerCase()===chassis.toLowerCase() &&
    v.id!==editingVehicleId
  );

  if(duplicate){
    toast("This Chassis No. already exists","error");
    return;
  }

  const data={
    id:editingVehicleId || uid(),
    productionMonth:document.getElementById("vMonth").value,
    series:document.getElementById("vSeries").value.trim(),
    length:document.getElementById("vLength").value.trim(),
    chassis,
    bodyType:document.getElementById("vBody").value.trim(),
    bodyBuilder:document.getElementById("vBuilder").value.trim(),
    customer:document.getElementById("vCustomer").value.trim(),
    carNo:document.getElementById("vCarNo").value.trim(),
    requiredDate:document.getElementById("vRequired").value,
    stage:Number(document.getElementById("vStage").value),
    remark:document.getElementById("vRemark").value.trim(),
    createdAt:today()
  };

  if(editingVehicleId){
    const index=vehicles.findIndex(v=>v.id===editingVehicleId);

    if(index>=0){
      vehicles[index]=data;
    }
  }else{
    vehicles.unshift(data);
  }

  saveVehicles();
  closeModal();
  renderPage();
  toast("Vehicle saved","success");
}

function deleteVehicle(id){

  if(!confirm("Delete this vehicle?")) return;

  vehicles=vehicles.filter(v=>v.id!==id);

  saveVehicles();

  closeModal();
  renderPage();

  toast("Vehicle deleted","success");
}

            type="number"

        </div>

        <div class="form-group">

          <select class="form-control" id="tStatus">

              ${t?.status!=="Paid" ? "selected":""}>
              Pending
            </option>

            <option value="Paid"
              ${t?.status==="Paid" ? "selected":""}>
              Paid
            </option>

          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Tax Paid Date</label>
          <input
            class="form-control"
            id="tPaidDate"
            type="date"
            value="${escapeHtml(t?.paidDate || "")}">
        </div>

        <div class="form-group form-full">
          <label class="form-label">Remark</label>
          <textarea
            class="form-control"
            id="tRemark">${escapeHtml(t?.remark || "")}</textarea>
        </div>

      </div>

      <div class="alert alert-warning" style="margin-top:15px">
        Save လုပ်တဲ့အခါ Invoice Number duplicate နဲ့ Chassis No. ကို
        Vehicle Master ထဲမှာရှိ/မရှိ တိုက်စစ်ပေးမယ်
      </div>

      <div class="form-actions">

        ${
          t
          ? `<button class="btn btn-danger" onclick="deleteTax('${t.id}')">
              Delete
             </button>`
          : ""
        }

        <button class="btn" onclick="closeModal()">Cancel</button>

        <button class="btn btn-primary" onclick="saveTaxRecord()">
          Save Invoice
        </button>

      </div>

    </div>
  `);
}

function calculateTaxAmount(){

  const qty=amountNumber(document.getElementById("tQty")?.value);
  const unit=amountNumber(document.getElementById("tUnit")?.value);

  const amount=qty*unit;

  const target=document.getElementById("tAmount");

  if(target){
    target.value=amount;
  }
}

function saveTaxRecord(){

  const invoice=document.getElementById("tInvoice").value.trim();
  const chassis=document.getElementById("tChassis").value.trim();

  if(!invoice){
    toast("Invoice Number is required","error");
    return;
  }

  if(!chassis){
    toast("Chassis No. is required","error");
    return;
  }

  const duplicateInvoice=taxRecords.find(t=>
    t.invoice.toLowerCase()===invoice.toLowerCase() &&
    t.id!==editingTaxId
  );

  if(duplicateInvoice){
    toast("Duplicate Invoice Number","error");
    return;
  }

  const qty=amountNumber(document.getElementById("tQty").value);
  const unit=amountNumber(document.getElementById("tUnit").value);
  const amount=qty*unit;

  const data={
    id:editingTaxId || uid(),
    month:document.getElementById("tMonth").value,
    invoice,
    series:document.getElementById("tSeries").value.trim(),
    length:document.getElementById("tLength").value.trim(),
    chassis,
    quantity:qty,
    unitPrice:unit,
    amount,
    status:document.getElementById("tStatus").value,
    paidDate:document.getElementById("tPaidDate").value,
    remark:document.getElementById("tRemark").value.trim(),
    createdAt:today()
  };

  if(editingTaxId){

    const index=taxRecords.findIndex(t=>t.id===editingTaxId);

    if(index>=0){
      taxRecords[index]=data;
    }

  }else{

    taxRecords.unshift(data);

  }

  saveTax();

  const vehicle=findVehicleByChassis(chassis);

  closeModal();
  renderPage();

  if(vehicle){
    toast("Tax invoice saved • Chassis MATCHED","success");
  }else{
    toast("Tax invoice saved • Chassis NOT MATCHED","error");
  }
}

function deleteTax(id){

  if(!confirm("Delete this tax invoice?")) return;

  taxRecords=taxRecords.filter(t=>t.id!==id);

  saveTax();

  closeModal();
  renderPage();

  toast("Tax invoice deleted","success");
}

  const stage=document.getElementById("vehicleStageFilter")?.value || "";

  const rows=vehicles.filter(v=>{

    const text=[
      v.series,
      v.length,
      v.chassis,
      v.bodyType,
      v.customer,
      v.carNo,
      v.productionMonth
    ].join(" ").toLowerCase();

    return (!search || text.includes(search)) &&
      (!stage || String(v.stage)===stage);
  });

  body.innerHTML=rows.length
    ? rows.map(v=>`
      <tr>

        <td>
          <strong>${escapeHtml(v.series)}</strong>
        </td>

        <td>${escapeHtml(v.length)}</td>

        <td>${escapeHtml(v.chassis)}</td>

        <td>${escapeHtml(v.bodyType)}</td>

        <td>${escapeHtml(v.customer)}</td>

        <td>${escapeHtml(v.carNo || "-")}</td>

        <td>${stageBadge(v.stage)}</td>

        <td>

          <div class="action-row">

            <button
              class="btn btn-small"
              onclick="openStageModal('${v.id}')">
              Stage
            </button>

            <button
              class="btn btn-small"
              onclick="openVehicleModal('${v.id}')">
              Edit
            </button>

          </div>

        </td>

      </tr>
    `).join("")
    :
    `<tr>
      <td colspan="8">
        <div class="empty">
          <div class="empty-icon">🚚</div>
          No vehicles found
        </div>
      </td>
    </tr>`;
}


/* =========================================================
   MATCHING
========================================================= */

function findVehicleByChassis(chassis){

  if(!chassis) return null;

  const normalized=chassis.trim().toLowerCase();

  return vehicles.find(v=>
    String(v.chassis || "").trim().toLowerCase()===normalized
  ) || null;
}


/* =========================================================
   CSV
========================================================= */

function csvEscape(v){

  const s=String(v ?? "");

  return `"${s.replaceAll('"','""')}"`;
}

function downloadCSV(filename,headers,rows){

  const csv=[
    headers.map(csvEscape).join(","),
    ...rows.map(row=>row.map(csvEscape).join(","))
  ].join("\n");

  const blob=new Blob(["\ufeff"+csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}

function exportTaxCSV(){

  downloadCSV(
    "MMC_Tax_Invoice.csv",
    [
      "Invoice Number",
      "Month",
      "Series",
      "Length",
      "Chassis No",
      "Quantity",
      "Unit Price",
      "Amount",
      "Status",

      "Vehicle Match"

    taxRecords.map(t=>[

      t.series,
      t.length,

/* =========================================================
   BACKUP
========================================================= */

function backupAll(){

  const backup={
    app:"Sales Manager Workflow Pro",
    version:"V3",
    exportedAt:new Date().toISOString(),
    vehicles,
    taxRecords,
    prices
  };

  const blob=new Blob(
    [JSON.stringify(backup,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="sales-manager-workflow-pro-backup.json";
  a.click();

  URL.revokeObjectURL(url);

  toast("Full backup downloaded","success");
}

function restoreBackup(file){

  const reader=new FileReader();

  reader.onload=()=>{

    try{

      const data=JSON.parse(reader.result);

      if(Array.isArray(data.vehicles)){
        vehicles=data.vehicles;
        saveVehicles();
      }

      if(Array.isArray(data.taxRecords)){
        taxRecords=data.taxRecords;
        saveTax();
      }

      if(Array.isArray(data.prices)){
        prices=data.prices;
        savePrices();
      }

      renderPage();

      toast("Backup restored","success");

    }catch(e){

      toast("Invalid backup file","error");

    }

  };

  reader.readAsText(file);
}

function clearAllData(){

  if(!confirm(
    "Clear all vehicle, tax and price data?\n\nThis cannot be undone."
  )) return;

  localStorage.removeItem(VEHICLE_KEY);
  localStorage.removeItem(TAX_KEY);
  localStorage.removeItem(PRICE_KEY);

  vehicles=[];
  taxRecords=[];
  prices=[];

  loadData();
  renderPage();

  toast("Data cleared and reset","success");
}


/* =========================================================
   MODAL
========================================================= */

function showModal(html){

  document.getElementById("modal").innerHTML=html;
  document.getElementById("modalBackdrop").classList.add("show");
  document.body.style.overflow="hidden";
}

function closeModal(){

  document.getElementById("modalBackdrop").classList.remove("show");
  document.body.style.overflow="";
}

document.getElementById("modalBackdrop").addEventListener("click",e=>{

  if(e.target.id==="modalBackdrop"){
    closeModal();
  }

});


/* =========================================================
   PAGE EVENTS
========================================================= */

function bindPageEvents(){

  const vehicleSearch=document.getElementById("vehicleSearch");

  if(vehicleSearch){
    vehicleSearch.addEventListener("input",renderVehicleTable);
  }

  const vehicleFilter=document.getElementById("vehicleStageFilter");

  if(vehicleFilter){
    vehicleFilter.addEventListener("change",renderVehicleTable);
  }

  const taxSearch=document.getElementById("taxSearch");

  if(taxSearch){
    taxSearch.addEventListener("input",renderTaxTable);
  }

  const taxFilter=document.getElementById("taxStatusFilter");

  if(taxFilter){
    taxFilter.addEventListener("change",renderTaxTable);
  }

  const priceSearch=document.getElementById("priceSearch");

  if(priceSearch){
    priceSearch.addEventListener("input",renderPriceTable);
  }

  const restore=document.getElementById("restoreInput");

  if(restore){
    restore.addEventListener("change",e=>{
      const file=e.target.files[0];

      if(file){
        restoreBackup(file);
      }
    });
  }

  renderVehicleTable();
  renderTaxTable();
  renderPriceTable();
}

   GLOBAL BUTTONS
========================================================= */

document.getElementById("globalAddBtn").addEventListener("click",()=>{
