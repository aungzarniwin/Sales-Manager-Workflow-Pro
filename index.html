<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Sales Manager Workflow Pro V2</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --dark:#111827;
  --dark-2:#1f2937;
  --green:#15803d;
  --green-bg:#ecfdf3;
  --orange:#c2410c;
  --orange-bg:#fff7ed;
  --red:#b91c1c;
  --red-bg:#fef2f2;
  --blue:#1d4ed8;
  --blue-bg:#eff6ff;
  --purple:#7e22ce;
  --purple-bg:#faf5ff;
  --radius:16px;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Myanmar","Myanmar Text",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:var(--dark);
  color:#fff;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  transition:.25s ease;
}

.brand{
  padding:24px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.4px;
}

.brand-sub{
  color:#9ca3af;
  font-size:12px;
  margin-top:5px;
}

.company-badge{
  display:inline-flex;
  margin-top:13px;
  padding:6px 10px;
  border-radius:8px;
  background:#1f2937;
  color:#d1d5db;
  font-size:11px;
  font-weight:700;
}

.nav{
  padding:16px 12px;
  overflow:auto;
  flex:1;
}

.nav-section{
  color:#6b7280;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:1px;
  padding:14px 10px 7px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#9ca3af;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:3px;
  font-weight:600;
  font-size:13px;
}

.nav-btn:hover{
  background:#1f2937;
  color:#fff;
}

.nav-btn.active{
  background:#fff;
  color:#111827;
}

.nav-icon{
  width:20px;
  text-align:center;
  font-size:16px;
}

.sidebar-footer{
  padding:14px;
  border-top:1px solid rgba(255,255,255,.08);
}

.manager-card{
  background:#1f2937;
  border-radius:12px;
  padding:12px;
}

.manager-name{
  font-size:13px;
  font-weight:700;
}

.manager-role{
  color:#9ca3af;
  font-size:11px;
  margin-top:3px;
}

/* MAIN */
.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-width:0;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:50;
}

.page-heading{
  display:flex;
  align-items:center;
  gap:10px;
}

.page-heading h1{
  font-size:20px;
  font-weight:800;
}

.page-heading span{
  font-size:12px;
  color:var(--muted);
}

.top-actions{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:9px 13px;
  font-weight:700;
  font-size:12px;
}

.btn:hover{
  background:var(--surface-2);
}

.btn-primary{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

.btn-primary:hover{
  background:#1f2937;
}

.btn-danger{
  color:var(--red);
  background:var(--red-bg);
  border-color:#fecaca;
}

.btn-small{
  padding:7px 9px;
  font-size:11px;
}

.mobile-menu{
  display:none;
  border:0;
  background:#fff;
  font-size:22px;
}

.content{
  padding:25px 28px 50px;
  max-width:1600px;
  margin:auto;
}

/* COMMON */
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title h2{
  font-size:16px;
  font-weight:800;
}

.section-title span{
  font-size:11px;
  color:var(--muted);
}

.grid{
  display:grid;
  gap:14px;
}

.kpi-grid{
  grid-template-columns:repeat(6,minmax(0,1fr));
  margin-bottom:24px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.kpi{
  padding:16px;
}

.kpi-label{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}

.kpi-value{
  font-size:25px;
  font-weight:850;
  margin-top:7px;
  letter-spacing:-.7px;
}

.kpi-note{
  margin-top:6px;
  font-size:10px;
  color:var(--muted);
}

.kpi-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--surface-2);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.two-col{
  grid-template-columns:1.3fr .7fr;
}

.three-col{
  grid-template-columns:repeat(3,1fr);
}

.panel{
  padding:18px;
}

.muted{
  color:var(--muted);
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* WORKFLOW */
.workflow{
  display:flex;
  overflow-x:auto;
  gap:0;
  padding:4px 0 8px;
}

.workflow-step{
  min-width:125px;
  text-align:center;
  position:relative;
  padding:0 7px;
}

.workflow-step:not(:last-child)::after{
  content:"";
  position:absolute;
  top:17px;
  left:calc(50% + 18px);
  width:calc(100% - 36px);
  height:2px;
  background:#e5e7eb;
}

.workflow-dot{
  width:35px;
  height:35px;
  margin:auto;
  border-radius:50%;
  background:#f3f4f6;
  border:2px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  position:relative;
  z-index:2;
}

.workflow-step.completed .workflow-dot{
  background:#dcfce7;
  border-color:#86efac;
  color:#15803d;
}

.workflow-step.current .workflow-dot{
  background:#111827;
  border-color:#111827;
  color:#fff;
}

.workflow-name{
  margin-top:7px;
  font-size:10px;
  font-weight:700;
  line-height:1.3;
}

/* STATUS */
.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.status-pending{
  color:#92400e;
  background:#fef3c7;
}

.status-progress{
  color:#1d4ed8;
  background:#dbeafe;
}

.status-completed{
  color:#166534;
  background:#dcfce7;
}

.status-danger{
  color:#991b1b;
  background:#fee2e2;
}

.status-neutral{
  color:#374151;
  background:#f3f4f6;
}

/* PRODUCTION */
.progress-row{
  margin-bottom:14px;
}

.progress-head{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  font-weight:700;
  margin-bottom:6px;
}

.progress-track{
  height:7px;
  background:#f1f5f9;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:#111827;
  border-radius:999px;
}

/* TABLE */
.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

th{
  background:#f8fafc;
  color:#6b7280;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.4px;
  font-weight:800;
  text-align:left;
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:12px;
  font-size:12px;
  border-bottom:1px solid #f1f5f9;
  vertical-align:middle;
}

tr:hover td{
  background:#fafafa;
}

.chassis{
  font-family:monospace;
  font-weight:700;
  font-size:11px;
}

.action-group{
  display:flex;
  gap:5px;
}

/* FILTER */
.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:13px;
}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:10px 11px;
  color:var(--text);
  outline:none;
  font-size:12px;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:#9ca3af;
  box-shadow:0 0 0 3px rgba(17,24,39,.05);
}

.filter-search{
  flex:1;
  min-width:220px;
}

.filter-select{
  width:180px;
}

/* FORMS */
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-label{
  font-size:11px;
  font-weight:800;
  color:#374151;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.58);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  background:#fff;
  width:min(800px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-head h3{
  font-size:16px;
}

.modal-close{
  border:0;
  background:#f3f4f6;
  width:32px;
  height:32px;
  border-radius:9px;
}

.modal-body{
  padding:20px;
}

/* VEHICLE DETAIL */
.detail-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.detail-title{
  font-size:19px;
  font-weight:850;
}

.detail-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:20px;
}

.detail-box{
  padding:11px;
  background:#f8fafc;
  border-radius:10px;
}

.detail-box label{
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-bottom:4px;
}

.detail-box strong{
  font-size:12px;
  word-break:break-word;
}

/* TIMELINE */
.timeline{
  position:relative;
  margin-top:10px;
}

.timeline::before{
  content:"";
  position:absolute;
  left:15px;
  top:10px;
  bottom:10px;
  width:2px;
  background:#e5e7eb;
}

.timeline-item{
  display:flex;
  gap:13px;
  position:relative;
  padding-bottom:18px;
}

.timeline-dot{
  width:32px;
  height:32px;
  flex:none;
  border-radius:50%;
  background:#f3f4f6;
  border:2px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  font-size:12px;
}

.timeline-item.done .timeline-dot{
  background:#dcfce7;
  border-color:#86efac;
}

.timeline-item.current .timeline-dot{
  background:#111827;
  border-color:#111827;
  color:#fff;
}

.timeline-content{
  padding-top:3px;
}

.timeline-content h4{
  font-size:12px;
  font-weight:800;
}

.timeline-content p{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

/* TASK */
.task{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #f1f5f9;
}

.task:last-child{
  border-bottom:0;
}

.task-check{
  width:20px;
  height:20px;
  accent-color:#111827;
}

.task-info{
  flex:1;
}

.task-title{
  font-size:12px;
  font-weight:700;
}

.task-meta{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

/* CUSTOMER */
.customer-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #f1f5f9;
}

.customer-row:last-child{
  border-bottom:0;
}

.customer-name{
  font-weight:800;
  font-size:12px;
}

.customer-count{
  color:var(--muted);
  font-size:10px;
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:500;
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:11px;
  font-size:12px;
  font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  transform:translateY(120px);
  opacity:0;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE OVERLAY */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:90;
}

.overlay.show{
  display:block;
}

/* RESPONSIVE */
@media(max-width:1200px){
  .kpi-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 15px;
    height:62px;
  }

  .page-heading h1{
    font-size:16px;
  }

  .page-heading span{
    display:none;
  }

  .content{
    padding:18px 14px 35px;
  }

  .two-col,
  .three-col{
    grid-template-columns:1fr;
  }

  .top-actions .export-btn{
    display:none;
  }
}

@media(max-width:600px){
  .kpi-grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .kpi{
    padding:13px;
  }

  .kpi-value{
    font-size:21px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .detail-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .workflow-step{
    min-width:105px;
  }

  .top-actions .add-btn{
    display:none;
  }

  .panel{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-title">Sales Manager Workflow Pro</div>
      <div class="brand-sub">Vehicle Sales & Operations</div>
      <div class="company-badge">ISUZU WORKSPACE</div>
    </div>

    <nav class="nav">

      <div class="nav-section">Workspace</div>

      <button class="nav-btn active" data-page="dashboard">
        <span class="nav-icon">⌂</span>
        Dashboard
      </button>

      <button class="nav-btn" data-page="vehicles">
        <span class="nav-icon">🚚</span>
        Vehicles
      </button>

      <button class="nav-btn" data-page="production">
        <span class="nav-icon">⚙</span>
        Production
      </button>

      <button class="nav-btn" data-page="registration">
        <span class="nav-icon">🪪</span>
        Registration
      </button>

      <button class="nav-btn" data-page="delivery">
        <span class="nav-icon">📦</span>
        Delivery
      </button>

      <div class="nav-section">Management</div>

      <button class="nav-btn" data-page="customers">
        <span class="nav-icon">👥</span>
        Customers
      </button>

      <button class="nav-btn" data-page="reports">
        <span class="nav-icon">▤</span>
        Reports
      </button>

      <button class="nav-btn" data-page="manager">
        <span class="nav-icon">✓</span>
        Daily Manager
      </button>

      <button class="nav-btn" data-page="settings">
        <span class="nav-icon">⚙</span>
        Settings
      </button>

    </nav>

    <div class="sidebar-footer">
      <div class="manager-card">
        <div class="manager-name">Sales Manager</div>
        <div class="manager-role">ISUZU Operations Workspace</div>
      </div>
    </div>

  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <div class="page-heading">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <span id="pageSubtitle">Sales Manager Command Center</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="btn export-btn" id="exportTop">Export CSV</button>
        <button class="btn btn-primary add-btn" id="addTop">+ Add Vehicle</button>
      </div>

    </header>

    <section class="content" id="content"></section>

  </main>

</div>

<!-- VEHICLE MODAL -->
<div class="modal-backdrop" id="vehicleModal">
  <div class="modal">

    <div class="modal-head">
      <h3 id="vehicleModalTitle">Add Vehicle</h3>
      <button class="modal-close" onclick="closeModal('vehicleModal')">✕</button>
    </div>

    <div class="modal-body">

      <form id="vehicleForm">

        <input type="hidden" id="vehicleId">

        <div class="form-grid">

          <div class="form-group">
            <label class="form-label">Production Month</label>
            <input class="input" id="productionMonth" type="month">
          </div>

          <div class="form-group">
            <label class="form-label">Series</label>
            <input class="input" id="series" placeholder="e.g. NLR / NMR / FVR">
          </div>

          <div class="form-group">
            <label class="form-label">Length</label>
            <input class="input" id="length" placeholder="e.g. 14 ft / 17 ft">
          </div>

          <div class="form-group">
            <label class="form-label">Chassis No. *</label>
            <input class="input" id="chassis" required placeholder="Enter chassis number">
          </div>

          <div class="form-group">
            <label class="form-label">Body Type</label>
            <input class="input" id="bodyType" placeholder="e.g. DRY BOX">
          </div>

          <div class="form-group">
            <label class="form-label">Body Builder</label>
            <input class="input" id="bodyBuilder" placeholder="Body builder / workshop">
          </div>

          <div class="form-group">
            <label class="form-label">Customer Name</label>
            <input class="input" id="customerName" placeholder="Customer / Fleet">
          </div>

          <div class="form-group">
            <label class="form-label">Car No.</label>
            <input class="input" id="carNo" placeholder="e.g. 5H/12345">
          </div>

          <div class="form-group">
            <label class="form-label">Required Delivery Date</label>
            <input class="input" id="requiredDate" type="date">
          </div>

          <div class="form-group">
            <label class="form-label">Current Stage</label>
            <select class="select" id="currentStage">
              <option value="production">Production</option>
              <option value="body">Body Building</option>
              <option value="number">နံပါတ်ယူ</option>
              <option value="inspection">ယာဉ်စစ်</option>
              <option value="tax">အခွန်ဆောင်</option>
              <option value="ownerbook">Owner Book ထုတ်</option>
              <option value="business">လုပ်ငန်းလုပ်</option>
              <option value="transfer">ကားလွှဲပြောင်း</option>
              <option value="delivery">Delivery</option>
            </select>
          </div>

          <div class="form-group full">
            <label class="form-label">Remark</label>
            <textarea class="textarea" id="remark" rows="3" placeholder="Notes / issue / follow-up"></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button type="button" class="btn" onclick="closeModal('vehicleModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Vehicle</button>
        </div>

      </form>

    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">

    <div class="modal-head">
      <h3>Vehicle Workflow</h3>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>

    <div class="modal-body" id="detailBody"></div>

  </div>
</div>

<!-- STAGE MODAL -->
<div class="modal-backdrop" id="stageModal">
  <div class="modal">

    <div class="modal-head">
      <h3>Update Workflow Stage</h3>
      <button class="modal-close" onclick="closeModal('stageModal')">✕</button>
    </div>

    <div class="modal-body">

      <input type="hidden" id="stageVehicleId">

      <div class="form-group">
        <label class="form-label">Workflow Stage</label>
        <select class="select" id="stageSelect">
          <option value="production">Production</option>
          <option value="body">Body Building</option>
          <option value="number">နံပါတ်ယူ</option>
          <option value="inspection">ယာဉ်စစ်</option>
          <option value="tax">အခွန်ဆောင်</option>
          <option value="ownerbook">Owner Book ထုတ်</option>
          <option value="business">လုပ်ငန်းလုပ်</option>
          <option value="transfer">ကားလွှဲပြောင်း</option>
          <option value="delivery">Delivery</option>
        </select>
      </div>

      <div class="form-group" style="margin-top:13px">
        <label class="form-label">Stage Date</label>
        <input class="input" id="stageDate" type="date">
      </div>

      <div class="form-group" style="margin-top:13px">
        <label class="form-label">Note</label>
        <textarea class="textarea" id="stageNote" rows="3" placeholder="Enter update note"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn" onclick="closeModal('stageModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveStage()">Update Stage</button>
      </div>

    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SALES MANAGER WORKFLOW PRO V2
   LocalStorage / No Firebase
========================================================= */

const STORAGE_KEY = "sales_manager_workflow_pro_v2";

const STAGES = [
  {id:"production", name:"Production", icon:"⚙"},
  {id:"body", name:"Body Building", icon:"🔧"},
  {id:"number", name:"နံပါတ်ယူ", icon:"🪪"},
  {id:"inspection", name:"ယာဉ်စစ်", icon:"🔍"},
  {id:"tax", name:"အခွန်ဆောင်", icon:"💰"},
  {id:"ownerbook", name:"Owner Book ထုတ်", icon:"📕"},
  {id:"business", name:"လုပ်ငန်းလုပ်", icon:"🏢"},
  {id:"transfer", name:"ကားလွှဲပြောင်း", icon:"🔄"},
  {id:"delivery", name:"Delivery", icon:"📦"}
];

let vehicles = [];
let currentPage = "dashboard";
let searchText = "";
let statusFilter = "all";

function uid(){
  return "v_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function loadData(){

  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){
      vehicles = JSON.parse(raw);
    }

  }catch(e){
    vehicles = [];
  }

  if(!Array.isArray(vehicles)){
    vehicles = [];
  }

  if(vehicles.length === 0){
    vehicles = [
      createDemoVehicle()
    ];

    saveData();
  }
}

function createDemoVehicle(){

  const v = {
    id:uid(),
    productionMonth:"2026-10",
    series:"NMR",
    length:"17 ft",
    chassis:"JAA1MR77HT7100921",
    bodyType:"DRY BOX",
    bodyBuilder:"Yoma Body",
    customerName:"Yoma Fleet",
    carNo:"",
    requiredDate:"2026-10-30",
    currentStage:"number",
    remark:"Production and body completed. Registration process pending.",
    createdAt:today(),
    stages:{}
  };

  STAGES.forEach((stage,index)=>{

    if(index < 2){
      v.stages[stage.id] = {
        status:"completed",
        date:index === 0 ? "2026-06-29" : "2026-07-15",
        note:"Completed"
      };
    }else if(stage.id === "number"){
      v.stages[stage.id] = {
        status:"pending",
        date:"",
        note:"Number application pending"
      };
    }else{
      v.stages[stage.id] = {
        status:"pending",
        date:"",
        note:""
      };
    }

  });

  return v;
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(vehicles));
}

function getStageIndex(stageId){
  return STAGES.findIndex(s=>s.id===stageId);
}

function stageName(id){
  const found = STAGES.find(s=>s.id===id);
  return found ? found.name : id;
}

function stageIcon(id){
  const found = STAGES.find(s=>s.id===id);
  return found ? found.icon : "•";
}

function statusClass(status){

  if(status === "completed") return "status-completed";
  if(status === "progress") return "status-progress";
  if(status === "danger") return "status-danger";

  return "status-pending";
}

function statusText(status){

  if(status === "completed") return "Completed";
  if(status === "progress") return "In Progress";
  if(status === "danger") return "Overdue";

  return "Pending";
}

function currentStage(v){
  return v.currentStage || "production";
}

function getVehicleStage(v,id){

  if(v.stages && v.stages[id]){
    return v.stages[id];
  }

  return {
    status:getStageIndex(id) < getStageIndex(currentStage(v)) ? "completed" : "pending",
    date:"",
    note:""
  };
}

function calculateStats(){

  const total = vehicles.length;

  const stats = {
    total,
    production:0,
    body:0,
    number:0,
    inspection:0,
    tax:0,
    ownerbook:0,
    business:0,
    transfer:0,
    delivery:0,
    delivered:0
  };

  vehicles.forEach(v=>{

    const index = getStageIndex(currentStage(v));

    if(index >= 0){

      stats[currentStage(v)]++;

      if(currentStage(v) === "delivery"){
        stats.delivered++;
      }

    }

  });

  return stats;
}

function render(){

  const content = document.getElementById("content");

  const pages = {
    dashboard:renderDashboard,
    vehicles:renderVehicles,
    production:renderProduction,
    registration:renderRegistration,
    delivery:renderDelivery,
    customers:renderCustomers,
    reports:renderReports,
    manager:renderManager,
    settings:renderSettings
  };

  content.innerHTML = pages[currentPage] ? pages[currentPage]() : renderDashboard();

  updateHeader();

  bindDynamicEvents();
}

function updateHeader(){

  const titles = {
    dashboard:["Dashboard","Sales Manager Command Center"],
    vehicles:["Vehicles","Vehicle master & workflow tracking"],
    production:["Production","Production and body building control"],
    registration:["Registration","Number, inspection, tax & owner book"],
    delivery:["Delivery","Business process, transfer & delivery"],
    customers:["Customers","Customer and fleet overview"],
    reports:["Reports","Management reports and workflow analysis"],
    manager:["Daily Manager","Today’s action and follow-up control"],
    settings:["Settings","System and data settings"]
  };

  const data = titles[currentPage] || titles.dashboard;

  document.getElementById("pageTitle").textContent = data[0];
  document.getElementById("pageSubtitle").textContent = data[1];

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===currentPage);
  });
}

/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const s = calculateStats();

  return `
    <div class="grid kpi-grid">

      ${kpi("🚚","Total Vehicles",s.total,"All tracked vehicles")}
      ${kpi("⚙","Production",s.production,"Current stage")}
      ${kpi("🔧","Body Building",s.body,"Current stage")}
      ${kpi("🪪","Number Pending",s.number,"Registration stage")}
      ${kpi("📕","Owner Book",s.ownerbook,"Current stage")}
      ${kpi("📦","Delivery",s.delivery,"Current stage")}

    </div>

    <div class="grid two-col">

      <div class="card panel">

        <div class="section-title">
          <h2>Vehicle Workflow</h2>
          <span>${s.total} vehicles</span>
        </div>

        <div class="workflow">
          ${STAGES.map((stage,i)=>{

            const count = vehicles.filter(v=>currentStage(v)===stage.id).length;

            return `
              <div class="workflow-step">
                <div class="workflow-dot">${stage.icon}</div>
                <div class="workflow-name">${stage.name}</div>
                <div style="font-size:10px;color:#6b7280;margin-top:3px">${count} cars</div>
              </div>
            `;

          }).join("")}
        </div>

      </div>

      <div class="card panel">

        <div class="section-title">
          <h2>Today's Focus</h2>
          <span>${today()}</span>
        </div>

        ${renderTodayFocus()}

      </div>

    </div>

    <div style="height:18px"></div>

    <div class="grid two-col">

      <div class="card panel">

        <div class="section-title">
          <h2>Registration Pipeline</h2>
          <span>Number → Owner Book</span>
        </div>

        ${renderRegistrationProgress()}

      </div>

      <div class="card panel">

        <div class="section-title">
          <h2>Customer Overview</h2>
          <span>Active fleet</span>
        </div>

        ${renderCustomerMini()}

      </div>

    </div>

    <div style="height:18px"></div>

    <div class="card panel">

      <div class="section-title">
        <h2>Latest Vehicles</h2>
        <button class="btn btn-small" onclick="goPage('vehicles')">View All</button>
      </div>

      ${renderVehicleTable(vehicles.slice(-8).reverse())}

    </div>
  `;
}

function kpi(icon,label,value,note){

  return `
    <div class="card kpi">
      <div class="kpi-icon">${icon}</div>
      <div class="kpi-label">${label}</div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-note">${note}</div>
    </div>
  `;
}

function renderTodayFocus(){

  const items = [];

  vehicles.forEach(v=>{

    const index = getStageIndex(currentStage(v));

    if(index >= 0 && index < STAGES.length-1){

      items.push({
        v,
        text:`Follow up: ${stageName(currentStage(v))}`,
        stage:currentStage(v)
      });

    }

  });

  if(items.length === 0){
    return `<div class="empty">No pending action today</div>`;
  }

  return items.slice(0,6).map(item=>`

    <div class="task">

      <div class="task-check" style="
        display:flex;
        align-items:center;
        justify-content:center;
        background:#f3f4f6;
        border-radius:6px;
        font-size:10px;
      ">${stageIcon(item.stage)}</div>

      <div class="task-info">
        <div class="task-title">${escapeHTML(item.v.chassis)}</div>
        <div class="task-meta">${escapeHTML(item.text)} • ${escapeHTML(item.v.customerName || "No customer")}</div>
      </div>

      <button class="btn btn-small" onclick="openDetail('${item.v.id}')">Open</button>

    </div>

  `).join("");
}

function renderRegistrationProgress(){

  const registrationStages = ["number","inspection","tax","ownerbook"];

  return registrationStages.map(id=>{

    const count = vehicles.filter(v=>currentStage(v)===id).length;
    const percentage = vehicles.length ? Math.round((count/vehicles.length)*100) : 0;

    return `
      <div class="progress-row">

        <div class="progress-head">
          <span>${stageIcon(id)} ${stageName(id)}</span>
          <span>${count}</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" style="width:${percentage}%"></div>
        </div>

      </div>
    `;

  }).join("");
}

function renderCustomerMini(){

  const map = {};

  vehicles.forEach(v=>{
    const name = v.customerName || "No Customer";
    map[name] = (map[name] || 0) + 1;
  });

  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7);

  if(entries.length===0){
    return `<div class="empty">No customer data</div>`;
  }

  return entries.map(([name,count])=>`

    <div class="customer-row">
      <div>
        <div class="customer-name">${escapeHTML(name)}</div>
        <div class="customer-count">Vehicle fleet</div>
      </div>
      <strong>${count}</strong>
    </div>

  `).join("");
}

/* =========================================================
   VEHICLES
========================================================= */

function renderVehicles(){

  let filtered = vehicles.filter(v=>{

    const search = searchText.toLowerCase();

    const matchesSearch =
      !search ||
      [
        v.chassis,
        v.customerName,
        v.carNo,
        v.series,
        v.bodyType,
        v.bodyBuilder
      ].join(" ").toLowerCase().includes(search);

    const matchesStatus =
      statusFilter==="all" ||
      currentStage(v)===statusFilter;

    return matchesSearch && matchesStatus;

  });

  return `

    <div class="card panel">

      <div class="section-title">
        <div>
          <h2>Vehicle Master</h2>
          <span>${filtered.length} of ${vehicles.length} vehicles</span>
        </div>

        <button class="btn btn-primary" onclick="openAddVehicle()">+ Add Vehicle</button>
      </div>

      <div class="filters">

        <div class="filter-search">
          <input
            class="input"
            id="vehicleSearch"
            value="${escapeHTML(searchText)}"
            placeholder="Search chassis, customer, car no, series..."
          >
        </div>

        <select class="select filter-select" id="stageFilter">

          <option value="all">All Stages</option>

          ${STAGES.map(s=>`
            <option value="${s.id}" ${statusFilter===s.id?"selected":""}>
              ${s.name}
            </option>
          `).join("")}

        </select>

      </div>

      ${renderVehicleTable(filtered)}

    </div>
  `;
}

function renderVehicleTable(list){

  if(!list.length){
    return `<div class="empty">No vehicles found</div>`;
  }

  return `
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Series</th>
            <th>Chassis No.</th>
            <th>Body</th>
            <th>Customer</th>
            <th>Car No.</th>
            <th>Current Stage</th>
            <th>Required Date</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>

          ${list.map(v=>`

            <tr>

              <td>
                <strong>${escapeHTML(v.series || "-")}</strong>
                <div style="font-size:10px;color:#6b7280">${escapeHTML(v.length || "")}</div>
              </td>

              <td class="chassis">${escapeHTML(v.chassis)}</td>

              <td>
                ${escapeHTML(v.bodyType || "-")}
                <div style="font-size:10px;color:#6b7280">${escapeHTML(v.bodyBuilder || "")}</div>
              </td>

              <td>${escapeHTML(v.customerName || "-")}</td>

              <td>${escapeHTML(v.carNo || "-")}</td>

              <td>
                <span class="status status-progress">
                  ${stageIcon(currentStage(v))} ${escapeHTML(stageName(currentStage(v)))}
                </span>
              </td>

              <td>${formatDate(v.requiredDate)}</td>

              <td>
                <div class="action-group">
                  <button class="btn btn-small" onclick="openDetail('${v.id}')">View</button>
                  <button class="btn btn-small" onclick="openStage('${v.id}')">Update</button>
                  <button class="btn btn-small" onclick="editVehicle('${v.id}')">Edit</button>
                  <button class="btn btn-small btn-danger" onclick="deleteVehicle('${v.id}')">Delete</button>
                </div>
              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>
  `;
}

/* =========================================================
   PRODUCTION
========================================================= */

function renderProduction(){

  const production = vehicles.filter(v=>
    ["production","body"].includes(currentStage(v))
  );

  const bodyCompleted = vehicles.filter(v=>{
    const index = getStageIndex(currentStage(v));
    return index >= getStageIndex("number");
  }).length;

  return `

    <div class="grid three-col">

      ${kpi("⚙","Production",vehicles.filter(v=>currentStage(v)==="production").length,"Production stage")}
      ${kpi("🔧","Body Building",vehicles.filter(v=>currentStage(v)==="body").length,"Body stage")}
      ${kpi("✓","Body Completed",bodyCompleted,"Moved to registration")}

    </div>

    <div style="height:18px"></div>

    <div class="card panel">

      <div class="section-title">
        <div>
          <h2>Production & Body Building</h2>
          <span>Production → Body Completed</span>
        </div>

        <button class="btn btn-primary" onclick="openAddVehicle()">+ Add Vehicle</button>
      </div>

      ${renderVehicleTable(production)}

    </div>
  `;
}

/* =========================================================
   REGISTRATION
========================================================= */

function renderRegistration(){

  const groups = {
    number:vehicles.filter(v=>currentStage(v)==="number"),
    inspection:vehicles.filter(v=>currentStage(v)==="inspection"),
    tax:vehicles.filter(v=>currentStage(v)==="tax"),
    ownerbook:vehicles.filter(v=>currentStage(v)==="ownerbook")
  };

  return `

    <div class="grid kpi-grid">

      ${kpi("🪪","နံပါတ်ယူ",groups.number.length,"Number process")}
      ${kpi("🔍","ယာဉ်စစ်",groups.inspection.length,"Inspection")}
      ${kpi("💰","အခွန်ဆောင်",groups.tax.length,"Tax process")}
      ${kpi("📕","Owner Book",groups.ownerbook.length,"Owner book")}
      ${kpi("🏢","လုပ်ငန်း",vehicles.filter(v=>currentStage(v)==="business").length,"Business process")}
      ${kpi("🔄","ကားလွှဲပြောင်း",vehicles.filter(v=>currentStage(v)==="transfer").length,"Transfer")}

    </div>

    <div class="card panel">

      <div class="section-title">
        <div>
          <h2>Registration Pipeline</h2>
          <span>Number → Inspection → Tax → Owner Book</span>
        </div>
      </div>

      <div class="workflow" style="margin-bottom:18px">

        ${["number","inspection","tax","ownerbook"].map((id,i)=>{

          const count = groups[id].length;

          return `
            <div class="workflow-step">
              <div class="workflow-dot">${stageIcon(id)}</div>
              <div class="workflow-name">${stageName(id)}</div>
              <div style="font-size:10px;color:#6b7280;margin-top:3px">${count} pending</div>
            </div>
          `;

        }).join("")}

      </div>

      ${renderVehicleTable(
        vehicles.filter(v=>
          ["number","inspection","tax","ownerbook"].includes(currentStage(v))
        )
      )}

    </div>
  `;
}

/* =========================================================
   DELIVERY
========================================================= */

function renderDelivery(){

  const list = vehicles.filter(v=>
    ["business","transfer","delivery"].includes(currentStage(v))
  );

  return `

    <div class="grid three-col">

      ${kpi("🏢","လုပ်ငန်းလုပ်",vehicles.filter(v=>currentStage(v)==="business").length,"Business process")}

      ${kpi("🔄","ကားလွှဲပြောင်း",vehicles.filter(v=>currentStage(v)==="transfer").length,"Transfer pending")}

      ${kpi("📦","Delivery",vehicles.filter(v=>currentStage(v)==="delivery").length,"Delivery stage")}

    </div>

    <div style="height:18px"></div>

    <div class="card panel">

      <div class="section-title">
        <div>
          <h2>Business → Transfer → Delivery</h2>
          <span>Final vehicle handover process</span>
        </div>
      </div>

      ${renderVehicleTable(list)}

    </div>
  `;
}

/* =========================================================
   CUSTOMERS
========================================================= */

function renderCustomers(){

  const map = {};

  vehicles.forEach(v=>{

    const name = v.customerName || "No Customer";

    if(!map[name]){
      map[name] = {
        total:0,
        stages:{}
      };
    }

    map[name].total++;

    const stage = currentStage(v);

    map[name].stages[stage] =
      (map[name].stages[stage] || 0) + 1;

  });

  const entries = Object.entries(map);

  return `

    <div class="grid three-col">

      ${kpi("👥","Customers",entries.length,"Unique customers")}
      ${kpi("🚚","Fleet Vehicles",vehicles.length,"Total vehicles")}
      ${kpi("📦","Delivered",vehicles.filter(v=>currentStage(v)==="delivery").length,"Current delivery stage")}

    </div>

    <div style="height:18px"></div>

    <div class="card panel">

      <div class="section-title">
        <h2>Customer / Fleet Overview</h2>
        <span>${entries.length} customers</span>
      </div>

      ${entries.length ? entries.map(([name,data])=>`

        <div class="customer-row">

          <div>
            <div class="customer-name">${escapeHTML(name)}</div>
            <div class="customer-count">

              ${Object.entries(data.stages).map(([stage,count])=>
                `${stageName(stage)}: ${count}`
              ).join(" • ")}

            </div>
          </div>

          <strong>${data.total}</strong>

        </div>

      `).join("") : `<div class="empty">No customers</div>`}

    </div>
  `;
}

/* =========================================================
   REPORTS
========================================================= */

function renderReports(){

  const s = calculateStats();

  return `

    <div class="grid three-col">

      ${kpi("🚚","Total",s.total,"All vehicles")}
      ${kpi("✓","Delivered",s.delivered,"Delivery stage")}
      ${kpi("⏳","Pending",vehicles.filter(v=>currentStage(v)!=="delivery").length,"Not yet delivered")}

    </div>

    <div style="height:18px"></div>

    <div class="grid two-col">

      <div class="card panel">

        <div class="section-title">
          <h2>Workflow Distribution</h2>
          <span>Current stage</span>
        </div>

        ${STAGES.map(stage=>{

          const count = vehicles.filter(v=>currentStage(v)===stage.id).length;
          const pct = vehicles.length ? Math.round(count/vehicles.length*100) : 0;

          return `
            <div class="progress-row">

              <div class="progress-head">
                <span>${stage.icon} ${stage.name}</span>
                <span>${count} (${pct}%)</span>
              </div>

              <div class="progress-track">
                <div class="progress-fill" style="width:${pct}%"></div>
              </div>

            </div>
          `;

        }).join("")}

      </div>

      <div class="card panel">

        <div class="section-title">
          <h2>Body Type Report</h2>
          <span>Vehicle count</span>
        </div>

        ${renderBodyTypeReport()}

      </div>

    </div>

    <div style="height:18px"></div>

    <div class="card panel">

      <div class="section-title">
        <h2>Management Report</h2>
        <button class="btn btn-primary btn-small" onclick="exportCSV()">Export CSV</button>
      </div>

      ${renderVehicleTable(vehicles)}

    </div>
  `;
}

function renderBodyTypeReport(){

  const map = {};

  vehicles.forEach(v=>{
    const body = v.bodyType || "Unknown";
    map[body] = (map[body] || 0) + 1;
  });

  const entries = Object.entries(map);

  if(!entries.length){
    return `<div class="empty">No body data</div>`;
  }

  return entries.map(([name,count])=>{

    const pct = vehicles.length ? Math.round(count/vehicles.length*100) : 0;

    return `
      <div class="progress-row">

        <div class="progress-head">
          <span>${escapeHTML(name)}</span>
          <span>${count}</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>

      </div>
    `;

  }).join("");
}

/* =========================================================
   DETAIL
========================================================= */

function openDetail(id){

  const v = vehicles.find(x=>x.id===id);

  if(!v) return;

  const index = getStageIndex(currentStage(v));

  document.getElementById("detailBody").innerHTML = `

    <div class="detail-head">

      <div>
        <div class="detail-title">
          ${escapeHTML(v.series || "Vehicle")} • ${escapeHTML(v.chassis)}
        </div>

        <div class="detail-sub">
          ${escapeHTML(v.customerName || "No Customer")}
        </div>
      </div>

      <span class="status status-progress">
        ${stageIcon(currentStage(v))}
        ${escapeHTML(stageName(currentStage(v)))}
      </span>

    </div>

    <div class="detail-grid">

      ${detailBox("Series",v.series)}
      ${detailBox("Length",v.length)}
      ${detailBox("Chassis No.",v.chassis)}
      ${detailBox("Body Type",v.bodyType)}
      ${detailBox("Body Builder",v.bodyBuilder)}
      ${detailBox("Customer",v.customerName)}
      ${detailBox("Car No.",v.carNo)}
      ${detailBox("Required Date",formatDate(v.requiredDate))}

    </div>

    <div class="section-title">
      <h2>Vehicle Workflow Timeline</h2>
      <button class="btn btn-small btn-primary" onclick="closeModal('detailModal');openStage('${v.id}')">
        Update Stage
      </button>
    </div>

    <div class="timeline">

      ${STAGES.map((stage,i)=>{

        const data = getVehicleStage(v,stage.id);

        let cls = "";

        if(i < index) cls = "done";
        if(i === index) cls = "current";

        if(data.status==="completed") cls="done";

        return `

          <div class="timeline-item ${cls}">

            <div class="timeline-dot">
              ${data.status==="completed" ? "✓" : stage.icon}
            </div>

            <div class="timeline-content">

              <h4>${stage.name}</h4>

              <p>
                ${data.status==="completed"
                  ? `Completed${data.date ? " • "+formatDate(data.date):""}`
                  : i===index
                    ? "Current stage"
                    : "Pending"
                }
              </p>

              ${data.note ? `
                <p>${escapeHTML(data.note)}</p>
              ` : ""}

            </div>

          </div>

        `;

      }).join("")}

    </div>

    ${v.remark ? `
      <div class="detail-box" style="margin-top:8px">
        <label>Remark</label>
        <strong>${escapeHTML(v.remark)}</strong>
      </div>
    ` : ""}

  `;

  openModal("detailModal");
}

function detailBox(label,value){

  return `
    <div class="detail-box">
      <label>${label}</label>
      <strong>${escapeHTML(value || "-")}</strong>
    </div>
  `;
}

/* =========================================================
   ADD / EDIT
========================================================= */

function openAddVehicle(){

  document.getElementById("vehicleModalTitle").textContent = "Add Vehicle";

  document.getElementById("vehicleForm").reset();

  document.getElementById("vehicleId").value = "";

  document.getElementById("productionMonth").value =
    new Date().toISOString().slice(0,7);

  document.getElementById("currentStage").value = "production";

  openModal("vehicleModal");
}

function editVehicle(id){

  const v = vehicles.find(x=>x.id===id);

  if(!v) return;

  document.getElementById("vehicleModalTitle").textContent = "Edit Vehicle";

  document.getElementById("vehicleId").value = v.id;
  document.getElementById("productionMonth").value = v.productionMonth || "";
  document.getElementById("series").value = v.series || "";
  document.getElementById("length").value = v.length || "";
  document.getElementById("chassis").value = v.chassis || "";
  document.getElementById("bodyType").value = v.bodyType || "";
  document.getElementById("bodyBuilder").value = v.bodyBuilder || "";
  document.getElementById("customerName").value = v.customerName || "";
  document.getElementById("carNo").value = v.carNo || "";
  document.getElementById("requiredDate").value = v.requiredDate || "";
  document.getElementById("currentStage").value = v.currentStage || "production";
  document.getElementById("remark").value = v.remark || "";

  openModal("vehicleModal");
}

document.getElementById("vehicleForm").addEventListener("submit",function(e){

  e.preventDefault();

  const id = document.getElementById("vehicleId").value;

  const chassis =
    document.getElementById("chassis").value.trim();

  if(!chassis){
    showToast("Chassis No. is required");
    return;
  }

  const duplicate = vehicles.find(v=>
    v.chassis.toLowerCase()===chassis.toLowerCase() &&
    v.id!==id
  );

  if(duplicate){
    showToast("This chassis number already exists");
    return;
  }

  const stage =
    document.getElementById("currentStage").value;

  if(id){

    const v = vehicles.find(x=>x.id===id);

    if(!v) return;

    v.productionMonth =
      document.getElementById("productionMonth").value;

    v.series =
      document.getElementById("series").value.trim();

    v.length =
      document.getElementById("length").value.trim();

    v.chassis = chassis;

    v.bodyType =
      document.getElementById("bodyType").value.trim();

    v.bodyBuilder =
      document.getElementById("bodyBuilder").value.trim();

    v.customerName =
      document.getElementById("customerName").value.trim();

    v.carNo =
      document.getElementById("carNo").value.trim();

    v.requiredDate =
      document.getElementById("requiredDate").value;

    v.currentStage = stage;

    v.remark =
      document.getElementById("remark").value.trim();

    if(!v.stages) v.stages={};

  }else{

    const v = {
      id:uid(),

      productionMonth:
        document.getElementById("productionMonth").value,

      series:
        document.getElementById("series").value.trim(),

      length:
        document.getElementById("length").value.trim(),

      chassis,

      bodyType:
        document.getElementById("bodyType").value.trim(),

      bodyBuilder:
        document.getElementById("bodyBuilder").value.trim(),

      customerName:
        document.getElementById("customerName").value.trim(),

      carNo:
        document.getElementById("carNo").value.trim(),

      requiredDate:
        document.getElementById("requiredDate").value,

      currentStage:stage,

      remark:
        document.getElementById("remark").value.trim(),

      createdAt:today(),

      stages:{}

    };

    STAGES.forEach((s,i)=>{

      const current = getStageIndex(stage);

      v.stages[s.id] = {
        status:i < current ? "completed" : "pending",
        date:"",
        note:""
      };

    });

    v.stages[stage] = {
      status:"progress",
      date:"",
      note:"Current stage"
    };

    vehicles.push(v);
  }

  saveData();

  closeModal("vehicleModal");

  render();

  showToast(id ? "Vehicle updated" : "Vehicle added");

});

/* =========================================================
   STAGE UPDATE
========================================================= */

function openStage(id){

  const v = vehicles.find(x=>x.id===id);

  if(!v) return;

  document.getElementById("stageVehicleId").value=id;
  document.getElementById("stageSelect").value=currentStage(v);
  document.getElementById("stageDate").value=today();
  document.getElementById("stageNote").value="";

  openModal("stageModal");
}

function saveStage(){

  const id =
    document.getElementById("stageVehicleId").value;

  const stage =
    document.getElementById("stageSelect").value;

  const date =
    document.getElementById("stageDate").value;

  const note =
    document.getElementById("stageNote").value.trim();

  const v = vehicles.find(x=>x.id===id);

  if(!v) return;

  if(!v.stages) v.stages={};

  const newIndex = getStageIndex(stage);

  STAGES.forEach((s,i)=>{

    if(i < newIndex){

      v.stages[s.id] = {
        status:"completed",
        date:v.stages[s.id]?.date || date || today(),
        note:v.stages[s.id]?.note || "Completed"
      };

    }else if(i===newIndex){

      v.stages[s.id] = {
        status:"progress",
        date:date || "",
        note:note || "Current stage"
      };

    }else{

      v.stages[s.id] = {
        status:"pending",
        date:"",
        note:""
      };

    }

  });

  v.currentStage=stage;

  if(stage==="delivery" && date){
    v.deliveryDate=date;
  }

  saveData();

  closeModal("stageModal");

  render();

  showToast("Workflow stage updated");

}

/* =========================================================
   DELETE
========================================================= */

function deleteVehicle(id){

  const v = vehicles.find(x=>x.id===id);

  if(!v) return;

  if(!confirm(`Delete vehicle ${v.chassis}?`)){
    return;
  }

  vehicles = vehicles.filter(x=>x.id!==id);

  saveData();

  render();

  showToast("Vehicle deleted");
}

/* =========================================================
   DATE
========================================================= */

function formatDate(date){

  if(!date) return "-";

  const d = new Date(date + "T00:00:00");

  if(Number.isNaN(d.getTime())) return date;

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

/* =========================================================
   CSV EXPORT
========================================================= */

function csvEscape(value){

  const str=String(value ?? "");

  return `"${str.replace(/"/g,'""')}"`;
}

function exportCSV(){

  const headers = [
    "Production Month",
    "Series",
    "Length",
    "Chassis No",
    "Body Type",
    "Body Builder",
    "Customer Name",
    "Car No",
    "Current Stage",
    "Required Delivery Date",
    "Number Status",
    "Inspection Status",
    "Tax Status",
    "Owner Book Status",
    "Business Status",
    "Transfer Status",
    "Delivery Status",
    "Remark"
  ];

  const rows=vehicles.map(v=>{

    const getStatus=id=>{
      const s=getVehicleStage(v,id);
      return s.status==="completed"
        ? `Completed ${s.date || ""}`
        : s.status==="progress"
          ? "In Progress"
          : "Pending";
    };

    return [
      v.productionMonth,
      v.series,
      v.length,
      v.chassis,
      v.bodyType,
      v.bodyBuilder,
      v.customerName,
      v.carNo,
      stageName(currentStage(v)),
      v.requiredDate,
      getStatus("number"),
      getStatus("inspection"),
      getStatus("tax"),
      getStatus("ownerbook"),
      getStatus("business"),
      getStatus("transfer"),
      getStatus("delivery"),
      v.remark
    ].map(csvEscape).join(",");

  });

  const csv =
    "\ufeff" +
    headers.map(csvEscape).join(",") +
    "\n" +
    rows.join("\n");

  const blob=new Blob([csv],{
    type:"text/csv;charset=utf-8;"
  });

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="sales-manager-workflow-vehicles.csv";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  showToast("CSV exported");
}

/* =========================================================
   JSON BACKUP
========================================================= */

function backupJSON(){

  const data={
    app:"Sales Manager Workflow Pro",
    version:"2.0",
    exportedAt:new Date().toISOString(),
    vehicles
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="sales-manager-workflow-backup.json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  showToast("Backup created");
}

function restoreJSON(event){

  const file=event.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const data=JSON.parse(reader.result);

      if(!Array.isArray(data.vehicles)){
        throw new Error("Invalid backup");
      }

      if(!confirm("Restore this backup? Current data will be replaced.")){
        return;
      }

      vehicles=data.vehicles;

      saveData();

      render();

      showToast("Backup restored");

    }catch(e){

      showToast("Invalid backup file");

    }

  };

  reader.readAsText(file);

  event.target.value="";
}

/* =========================================================
   CLEAR DATA
========================================================= */

function clearAllData(){

  if(!confirm("Clear ALL vehicle data? This cannot be undone.")){
    return;
  }

  if(!confirm("Please confirm again. All vehicles will be deleted.")){
    return;
  }

  vehicles=[];

  saveData();

  render();

  showToast("All data cleared");
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2400);
}
